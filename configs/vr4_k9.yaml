run:
  tag: VR4
  output_root: data/output

fragmentation:
  enabled: true
  input_type: csv
  input: data/input/libraries/VR4/VR4_v1_library.csv

  sequence_column: aa_sequence
  variant_id_column: gene_id
  metadata_columns:
    - criteria

  kmers:
    - 9

  variable_region:
    enabled: true
    start: 451
    end: 470
    mode: overlap

mhc:
  alleles:
    # A common internal name, followed by the format required by each tool
    - name: H2-Db
      mhcflurry: H2-D*b
      netmhcpan: H-2-Db

    - name: H2-Dd
      mhcflurry: H2-D*d
      netmhcpan: H-2-Dd

    - name: H2-Kb
      mhcflurry: H2-K*b
      netmhcpan: H-2-Kb

    - name: H2-Kd
      mhcflurry: H2-K*d
      netmhcpan: H-2-Kd

    - name: H2-Ld
      mhcflurry: H2-L*d
      netmhcpan: H-2-Ld

mhcflurry:
  enabled: true
  affinity_percentile_threshold: 2.0

netmhcpan:
  enabled: true
  executable: tools/netMHCpan-4.2/netMHCpan
  el_rank_threshold: 2.0
  deduplicate: true

combine:
  enabled: true
  sequence_column: aa_sequence
  library_id_column: gene_id
  library: data/input/libraries/VR4/VR4_v1_library.csv
  variable_region_start: 451
  variable_region_end: 470
  wild_type_variable_region: INGSGQNQQTLKFSVAGPSN
